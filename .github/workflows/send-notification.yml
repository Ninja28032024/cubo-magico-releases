name: Enviar notificacao FCM



on:

  push:
  
    branches:
    
      - main
      
    paths:
    
      - notification.json
      
  workflow_dispatch:
  
    inputs:
    
      dry_run:
      
        description: Validar autenticacao e payload sem enviar
        
        required: false
        
        default: true
        
        type: boolean
        


permissions:

  contents: read
  


jobs:

  send-fcm:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Autenticar no Google Cloud
      
        id: auth
        
        uses: google-github-actions/auth@v2
        
        with:
        
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          
          token_format: access_token
          
      - name: Montar e validar payload
      
        run: |
        
          set -euo pipefail
          
          message="$(jq -r '.message // empty' notification.json)"
          
          title="$(jq -r '.title // "Cubo Magico 7D"' notification.json)"
          
          notification_id="$(jq -r '.id // .sentAt // empty' notification.json)"
          
          test -n "$message"
          
          test -n "$notification_id"
          
          jq -n --arg title "$title" --arg body "$message" --arg id "$notification_id" '{message:{topic:"cubo_magico_todos",notification:{title:$title,body:$body},data:{notification_id:$id}}}' > /tmp/fcm-payload.json
          
      - name: Enviar notificacao para todos os dispositivos
      
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        
        env:
        
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          
          FIREBASE_PROJECT_ID: cubo-magico-7d-push-2026
          
        run: |
        
          set -euo pipefail
          
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json; UTF-8" "https://fcm.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/messages:send" --data-binary @/tmp/fcm-payload.json
          
      - name: Confirmar dry-run
      
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        
        run: echo "Dry-run concluido; nenhum dispositivo foi notificado."









































